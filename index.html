<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://borghese-gladiator.github.io/" />
    <meta name="theme-color" content="#0f74cc" />
    <title>Timothy Shee</title>
    <meta
      name="description"
      content="Portfolio of Timothy Shee, a software engineer who works on full stack development, DevOps, and NLP."
    />
    <script>
      // Paint the stored mode before the first frame, or the page flashes the
      // other one. The store in src/theme/theme.ts owns this key.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
